services:
  - type: web
    name: kilele-tours-travel
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
    # Render's free plan does not support persistent disks — the SQLite
    # database will reset on every redeploy and on periodic free-plan
    # restarts. Fine for testing the deployment; upgrade to at least the
    # Starter plan before relying on this for real bookings. Once upgraded,
    # uncomment the block below and add a DATA_DIR env var set to /data so
    # the database survives restarts and redeploys.
    #
    # disk:
    #   name: kilele-data
    #   mountPath: /data
    #   sizeGB: 1
    #
    # envVars (add alongside the ones above):
    #   - key: DATA_DIR
    #     value: /data
